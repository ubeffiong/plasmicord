[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plasmid-annotation-core"
version = "0.1.0"
description = "Reusable local plasmid annotation and provenance components for PlasmiCord and PlasBench"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
packages = ["plasmid_annotation"]
package-dir = {plasmid_annotation = "../plasmid_annotation"}
