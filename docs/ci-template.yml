name: PlasmiCord standalone core
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s test -p test_standalone.py -v
      - run: python -m unittest discover -s test -p test_gap_workflows.py -v
      - run: python -m unittest discover -s test -p test_detailed_report.py -v
      - run: python test/test_clustering.py
      - run: python test/test_network_discordance.py
      - run: plasmicord demo --out results_ci
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-report-${{ matrix.os }}-${{ matrix.python }}
          path: results_ci/results/
