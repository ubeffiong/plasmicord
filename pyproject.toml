[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plasmicord"
version = "0.5.0"
description = "PlasmiCord: A Chromosome-Aware Plasmid Transmission and Surveillance Framework"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Ubokobong Effiong"}]
dependencies = []

[project.scripts]
plasmicord = "transmission.cli:main"
transmission = "transmission.cli:main"

[project.urls]
Homepage = "https://github.com/ubeffiong/plasmicord"
Repository = "https://github.com/ubeffiong/plasmicord"
Issues = "https://github.com/ubeffiong/plasmicord/issues"

[tool.setuptools]
packages = ["transmission", "plasmid_annotation"]
package-dir = {transmission = "python"}

[tool.setuptools.package-data]
transmission = ["report_template.html", "report.css", "report.js", "report_dashboard.js"]
