[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plasmid-transmission-framework"
version = "0.2.0"
description = "Standalone plasmid-sharing networks, chromosome discordance and functional cargo reporting"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Ubokobong Effiong"}]
dependencies = []

[project.scripts]
transmission = "transmission.cli:main"

[tool.setuptools]
packages = ["transmission"]
package-dir = {transmission = "python"}

[tool.setuptools.package-data]
transmission = ["report_template.html"]
